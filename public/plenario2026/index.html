<title>Plenario 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">



<style>
/* Inter y DM Mono servidas desde el propio dominio: la política de contenido
   del sitio no deja traer nada de afuera, y así el cronograma no le cuenta a
   Google quién lo abre. Inter es variable, un solo archivo para todos los
   pesos. Solo el subconjunto latino, que es el que necesita el castellano. */
@font-face{font-family:'Inter';font-style:normal;font-weight:300 700;font-display:swap;src:url(/plenario2026/tipografias/inter.woff2) format('woff2')}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/plenario2026/tipografias/dm-mono-400.woff2) format('woff2')}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/plenario2026/tipografias/dm-mono-500.woff2) format('woff2')}
/* Identidad FACTTIC (facttic-web / presupuesto 701): fondo oscuro con grilla de puntos,
   Inter para títulos, DM Mono para texto y datos, bordes punteados, paleta de etapas.
   Layout: una columna; pestañas de días, filtros y lista hora | actividad | lugar. */
:root {
  --bg: #222222;
  --bg-deep: #101010;
  --fg: #f2f2f2;
  --fg-80: rgba(242, 242, 242, 0.8);
  --fg-70: rgba(242, 242, 242, 0.7);
  --fg-50: rgba(242, 242, 242, 0.5);
  --fg-40: rgba(242, 242, 242, 0.4);
  --fg-20: rgba(242, 242, 242, 0.2);
  --fg-10: rgba(242, 242, 242, 0.1);
  --surface: rgba(242, 242, 242, 0.03);
  --border: rgba(242, 242, 242, 0.35);

  --c-azul: #0067b2;
  --c-celeste: #57c3c8;
  --c-lila: #d6bbf2;
  --c-naranja: #ff522a;
  --c-rojo: #f76b7b;
  --c-amarillo: #e5f280;
  --c-verde: #8e8001;

  --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 16px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
/* Grilla de puntos del sitio de FACTTIC */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(circle at 1px 1px, var(--fg-10) 1px, transparent 0);
  background-size: 32px 32px;
}
.page { position: relative; z-index: 1; }

.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Barra superior */
.nav { border-bottom: 1px dashed var(--fg-20); }
.nav .wrap { display: flex; flex-direction: row-reverse; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.logo { font-family: var(--sans); font-weight: 500; font-size: 21px; letter-spacing: .02em; white-space: nowrap; }
.logo .br { font-weight: 300; }
.nav-meta { font-size: 13px; color: var(--fg-50); }

main.wrap { display: grid; gap: 32px; padding-block: clamp(48px, 8vw, 88px) 80px; }

/* Encabezado */
header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
.eyebrow {
  display: block; font-family: var(--sans); font-size: 12px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--fg-40); margin-bottom: 14px;
}
h1 {
  font-family: var(--sans); font-weight: 700; margin: 0;
  font-size: clamp(38px, 6vw, 64px); line-height: 1.04; letter-spacing: -.03em; text-wrap: balance;
}
.lede { margin: 18px 0 0; color: var(--fg-70); font-size: clamp(15px, 1.4vw, 17px); max-width: 60ch; }
.venue {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-top: 24px;
  padding-top: 18px; border-top: 1px dashed var(--fg-20);
}
.venue .eyebrow { margin: 0; width: 100%; }
.venue-name { font-family: var(--sans); font-weight: 600; font-size: 17px; }
.venue-addr { color: var(--fg-70); font-size: 14px; }
.closing { font-family: var(--sans); font-weight: 700; font-size: clamp(24px, 3vw, 32px); letter-spacing: -.02em; color: var(--fg); margin: 0 0 8px; }
.title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.glyphs { display: flex; gap: 10px; }
.glyphs svg { width: clamp(28px, 4.5vw, 48px); height: clamp(28px, 4.5vw, 48px); }

/* Días */
.days {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: clamp(8px, 2vw, 24px);
}
/* Tarjetas de día al estilo de las de cifras del sitio: gris sólido, etiqueta arriba y dato grande abajo */
.day {
  appearance: none; font: inherit; color: var(--fg); text-align: left; cursor: pointer;
  background: #3d3d3d; border: 0; border-radius: 10px;
  min-height: clamp(130px, 16vw, 190px); padding: clamp(18px, 2.4vw, 30px);
  display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
  transition: background .2s, color .2s;
}
.day small { font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-70); }
.day strong { font-family: var(--sans); font-weight: 700; font-size: clamp(40px, 5.6vw, 64px); line-height: 1; letter-spacing: -.02em; text-transform: uppercase; }
.day:hover { background: #474747; }
/* Color del día seleccionado: lila el primero, amarillo el segundo */
.day:nth-child(1) { --sel: var(--c-lila); }
.day:nth-child(2) { --sel: var(--c-amarillo); }
.day[aria-selected="true"] { background: var(--sel, var(--fg)); color: var(--bg-deep); }
.day[aria-selected="true"] small { color: rgba(16, 16, 16, .6); }

/* Filtros */
.filters { display: grid; gap: 18px; padding-top: 4px; }
.chips-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; min-width: 0; }
/* Flechas para recorrer las categorías (solo en mobile) */
.chip-nav { display: none; gap: 8px; flex: none; }
.arrow {
  appearance: none; cursor: pointer; width: 40px; height: 36px; border-radius: 10px;
  display: grid; place-items: center; padding: 0;
  background: var(--fg); color: var(--bg-deep); border: 1px solid var(--fg);
  transition: background .2s, color .2s, border-color .2s;
}
.arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.arrow:disabled { cursor: default; background: transparent; color: var(--fg); border: 1px dashed var(--fg-70); }
.chip {
  appearance: none; font-family: var(--mono); font-size: 13px; cursor: pointer;
  padding: 6px 11px; border-radius: 5px; border: 0; font-weight: 500;
  --c: var(--fg);
  /* Estilo de etiqueta del sitio: fondo teñido oscuro y texto del color de la categoría */
  background: color-mix(in srgb, var(--c) 22%, var(--bg));
  color: color-mix(in srgb, var(--c), #fff var(--lift, 20%));
  transition: background .2s, color .2s;
}
.chip:hover { background: color-mix(in srgb, var(--c) 36%, var(--bg)); }
.chip[aria-pressed="true"] { background: var(--c); color: var(--on, var(--bg-deep)); }
.place { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.place label { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-40); }
.place select {
  font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 8px;
  border: 1px dashed var(--fg); background: var(--bg); color: var(--fg); min-width: 220px; max-width: 100%;
}
:focus-visible { outline: 2px solid var(--c-lila); outline-offset: 2px; }

/* Lista */
.list-card { --pad: clamp(16px, 3vw, 32px); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 6px var(--pad); overflow: hidden; }
.count {
  display: flex; justify-content: space-between; gap: 12px; padding: 14px 0;
  border-bottom: 1px dashed var(--fg-20); font-size: 13px; color: var(--fg-50);
}
.list { list-style: none; margin: 0; padding: 0; }
.item {
  display: grid; grid-template-columns: 70px minmax(0, 1fr) auto;
  gap: 6px 24px; align-items: start; padding: 18px var(--pad); border-bottom: 1px dashed var(--fg-20);
  /* La fila ocupa todo el ancho de la tarjeta para que el resaltado llegue a los bordes */
  margin-inline: calc(var(--pad) * -1);
  transition: background .2s;
}
@media (hover: hover) {
  .item:hover { background: rgba(242, 242, 242, 0.06); }
}
.item:last-child { border-bottom: 0; }
.time { font-family: var(--sans); font-weight: 700; font-size: 20px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.time small { display: block; font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: 0; color: var(--fg-50); margin-top: 2px; }
.body { display: grid; gap: 4px; min-width: 0; }
.detail { color: var(--fg-70); font-size: 14px; }
.cat {
  font-family: var(--mono); font-size: 10px; font-weight: 400; line-height: 1.4;
  letter-spacing: .08em; text-transform: uppercase; color: var(--fg-40);
}
.title { font-family: var(--sans); font-weight: 600; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
.where { display: flex; align-items: center; gap: 14px; font-size: 13px; text-align: right; white-space: nowrap; padding-top: 2px; }
.where span { color: var(--fg-50); }
.where span b { color: var(--fg-80); font-weight: 500; }
.map {
  font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--fg); text-decoration: none;
  border: 1px dashed var(--fg); border-radius: 6px; padding: 4px 9px; transition: background .2s, color .2s;
}
.map:hover { background: var(--c-lila); border-color: var(--c-lila); color: var(--bg-deep); }
.empty { padding: 44px 0; text-align: center; color: var(--fg-50); }
.empty button { font: inherit; color: var(--fg); background: none; border: 0; text-decoration: underline; cursor: pointer; }

.closing { padding-bottom: 8px; }

/* Footer (como el de facttic-web) */
.site-footer { border-top: 1px dashed var(--fg-20); margin-top: 48px; font-family: var(--sans); font-size: 13px; color: var(--fg-40); }
.site-footer .wrap { padding-block: clamp(32px, 5vw, 56px); display: grid; gap: clamp(32px, 6vw, 72px); }
.foot-brand { display: grid; gap: 16px; max-width: 260px; }
.foot-brand img { height: 22px; width: auto; }
.foot-brand p { margin: 0; line-height: 1.5; }
.foot-bottom { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; }
.foot-left { display: flex; align-items: center; gap: 24px; }
.social { list-style: none; margin: 0; padding: 0; display: flex; gap: 16px; }
.social a { display: block; color: var(--fg-50); transition: color .2s; }
.social a:hover { color: var(--fg); }
.social svg { width: 16px; height: 16px; display: block; }
.logo img { height: 22px; width: auto; display: block; }

@media (max-width: 640px) {
  header { grid-template-columns: 1fr; }
  .title-row { gap: 10px 16px; }
  .glyphs { gap: 6px; }
  .nav .wrap { padding-block: 16px; }
  .nav-meta { display: none; }
  main.wrap { gap: 24px; padding-block: 32px 56px; }
  h1 { font-size: 34px; }
  .venue { margin-top: 18px; padding-top: 14px; }
  .venue-name { font-size: 16px; }
  .venue-addr { font-size: 13px; }

  /* Días: dos columnas compactas */
  .days { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .day { min-height: 112px; padding: 14px 16px; border-radius: 8px; }
  .day small { font-size: 11px; }
  .day strong { font-size: 32px; }

  /* Filtros: una fila que se desliza de costado */
  .chips {
    flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    margin-left: -16px; padding-left: 16px; scroll-padding-left: 16px;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 24px), transparent);
    mask-image: linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 24px), transparent);
  }
  .chip-nav { display: flex; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-size: 12px; padding: 6px 11px; }

  /* Lista */
  .list-card { --pad: 14px; padding: 2px var(--pad); border-radius: 12px; }
  .count { font-size: 12px; padding: 12px 0; }
  .item { grid-template-columns: 48px minmax(0, 1fr); gap: 4px 12px; padding-block: 14px; }
  .time { font-size: 16px; padding-top: 1px; }
  .title { font-size: 16px; }
  .detail { font-size: 13px; }
  .where { grid-column: 2; justify-content: flex-start; text-align: left; white-space: normal; flex-wrap: wrap; gap: 8px 12px; }

  .site-footer { margin-top: 32px; }
}
@media (prefers-reduced-motion: no-preference) {
  .item { animation: in .3s ease both; }
  @keyframes in { from { opacity: .3; transform: translateY(6px); } }
}
</style>

};

// Lugares: nombre y dirección (se usa para el enlace al mapa).
// El primero es la sede: se muestra arriba. Los demás aparecen en su actividad con enlace al mapa.
const LUGARES = {
  "CTA Autónoma - Nacional": "Bartolomé Mitre 748, CABA",
  "Uniendo Orillas": "Gorriti 4391, Palermo, CABA",
};

const DIAS = [
  { id: "d1", etiqueta: "Día 1", fecha: "2026-11-06" },
  { id: "d2", etiqueta: "Día 2", fecha: "2026-11-07" },
];

// dia, inicio, fin, categoria, titulo, detalle (opcional), lugar, sala (opcional)
const ACTIVIDADES = [
  ["d1","09:00","10:00","Encuentros","Acreditación y desayuno","","CTA Autónoma - Nacional",""],
  ["d1","10:00","11:45","Asamblea","Asamblea General Ordinaria","Votación del nuevo Consejo de Administración de la Federación","CTA Autónoma - Nacional",""],
  ["d1","11:45","12:00","Presentaciones","Lanzamiento de la web","","CTA Autónoma - Nacional",""],
  ["d1","12:00","13:00","Encuentros","Almuerzo","","CTA Autónoma - Nacional",""],
  ["d1","13:00","13:45","Presentaciones","Campaña comercial y plan de trabajo","","CTA Autónoma - Nacional",""],
  ["d1","13:45","15:45","Debates","Eje comercial","","CTA Autónoma - Nacional",""],
  ["d1","15:45","16:15","Encuentros","Descanso","","CTA Autónoma - Nacional",""],
  ["d1","16:15","18:00","Debates","Eje institucional","Organización y posicionamiento","CTA Autónoma - Nacional",""],
  ["d1","20:00","","Encuentros","Juntada en Uniendo Orillas","Podés venir con tu cooperativista amigue.","Uniendo Orillas",""],

  ["d2","10:30","12:30","Paneles","IA y soberanía","","CTA Autónoma - Nacional",""],
];

const CIERRE = "¡Hasta la próxima!";
/* ====================================================== */

const acts = ACTIVIDADES.map(([dia, hora, fin, cat, titulo, detalle, lugar, sala]) => ({ dia, hora, fin, cat, titulo, detalle, lugar, sala }));
const SEDE = Object.keys(LUGARES)[0];
const state = { dia: DIAS[0].id, cat: "TODAS", lugar: "" };
try {
  const s = JSON.parse(localStorage.getItem("crono-state") || "{}");
  if (DIAS.some(d => d.id === s.dia)) state.dia = s.dia;
} catch (e) {}

const $ = id => document.getElementById(id);
const DOW = ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"];
const MON = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const mapUrl = lugar =>
  "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(LUGARES[lugar] ? `${lugar}, ${LUGARES[lugar]}` : lugar);
// Color de fondo de la categoría y color de texto que se lee encima
const FONDOS_OSCUROS = ["var(--c-azul)", "var(--c-verde)"];
const catStyle = n => {
  const c = CATEGORIAS[n] || "var(--fg-50)";
  const oscuro = FONDOS_OSCUROS.includes(c);
  // --lift aclara el texto de la etiqueta en los colores oscuros para que se lea sobre el fondo
  return `--c:${c};--on:${oscuro ? "var(--fg)" : "var(--bg-deep)"};--lift:${oscuro ? "50%" : "20%"}`;
};
const parts = f => { const [y, m, d] = f.split("-").map(Number); return { m, d, dt: new Date(y, m - 1, d) }; };

const first = parts(DIAS[0].fecha), last = parts(DIAS[DIAS.length - 1].fecha);
$("ev-name").textContent = EVENTO.nombre;
$("nav-meta").textContent = `${EVENTO.ciudad} · ${first.d}–${last.d} ${MON[last.m - 1].toLowerCase()}`;
$("closing").textContent = CIERRE;
if (SEDE) {
  const [nombre, dir] = [SEDE, LUGARES[SEDE]];
  $("venue").innerHTML = `<span class="eyebrow">Sede</span>
    <span class="venue-name">${esc(nombre)}</span>
    <span class="venue-addr">${esc(dir)}</span>
    <a class="map" href="${mapUrl(nombre)}" target="_blank" rel="noopener">Mapa ↗</a>`;
  $("venue").hidden = false;
  $("place-wrap").hidden = true;
}

// Días
$("days").innerHTML = DIAS.map(d => {
  const p = parts(d.fecha);
  return `<button class="day" role="tab" data-id="${d.id}"><small>${esc(d.etiqueta)}</small>
    <strong>${DOW[p.dt.getDay()]} ${p.d}</strong></button>`;
}).join("");
$("days").addEventListener("click", e => {
  const b = e.target.closest(".day"); if (!b) return;
  state.dia = b.dataset.id; render();
});

// Categorías
$("chips").innerHTML = `<button class="chip" data-cat="TODAS">Todas</button>` +
  Object.keys(CATEGORIAS).map(n =>
    `<button class="chip" data-cat="${esc(n)}" style="${catStyle(n)}">${esc(n)}</button>`).join("");
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.cat = b.dataset.cat; render();
});

// Flechas de categorías: desplazan la fila y se apagan al llegar a cada punta
const chipsEl = $("chips");
const updArrows = () => {
  const max = chipsEl.scrollWidth - chipsEl.clientWidth;
  $("prev").disabled = chipsEl.scrollLeft <= 2;
  $("next").disabled = chipsEl.scrollLeft >= max - 2;
};
$("prev").addEventListener("click", () => chipsEl.scrollBy({ left: -chipsEl.clientWidth * .7, behavior: "smooth" }));
$("next").addEventListener("click", () => chipsEl.scrollBy({ left: chipsEl.clientWidth * .7, behavior: "smooth" }));
chipsEl.addEventListener("scroll", updArrows, { passive: true });
window.addEventListener("resize", updArrows);
updArrows();

// Lugares
$("place").innerHTML = `<option value="">Todos</option>` +
  Object.keys(LUGARES).map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join("");
$("place").addEventListener("change", e => { state.lugar = e.target.value; render(); });


function render() {
  try { localStorage.setItem("crono-state", JSON.stringify({ dia: state.dia })); } catch (e) {}
  document.querySelectorAll(".day").forEach(b => b.setAttribute("aria-selected", b.dataset.id === state.dia));
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === state.cat));
  $("place").value = state.lugar;

  const dia = DIAS.find(d => d.id === state.dia);
  const p = parts(dia.fecha);
  $("day-label").textContent = `${dia.etiqueta} · ${DOW[p.dt.getDay()].toLowerCase()} ${p.d}/${p.m}`;

  const rows = acts
    .filter(a => a.dia === state.dia
      && (state.cat === "TODAS" || a.cat === state.cat)
      && (!state.lugar || a.lugar === state.lugar))
    .sort((a, b) => a.hora.localeCompare(b.hora));

  $("count").textContent = rows.length === 1 ? "1 actividad" : `${rows.length} actividades`;

  if (!rows.length) {
    $("list").innerHTML = `<li class="empty">No hay actividades con estos filtros ese día.
      <button type="button" id="reset">Ver todas</button></li>`;
    $("reset").onclick = () => { state.cat = "TODAS"; state.lugar = ""; render(); };
    return;
  }
  $("list").innerHTML = rows.map(a => `
    <li class="item">
      <div class="time">${esc(a.hora)}</div>
      <div class="body">
        <span class="cat">${esc(a.cat)}</span>
        <span class="title">${esc(a.titulo)}</span>
        ${a.detalle ? `<span class="detail">${esc(a.detalle)}</span>` : ""}
      </div>
      ${a.lugar === SEDE ? (a.sala ? `<div class="where"><span>${esc(a.sala)}</span></div>` : "") : `<div class="where">
        <span><b>${esc(a.lugar)}</b>${a.sala ? " · " + esc(a.sala) : ""}</span>
        <a class="map" href="${mapUrl(a.lugar)}" target="_blank" rel="noopener">Mapa ↗</a>
      </div>`}
    </li>`).join("");
}
render();
</script>

</body></html>
